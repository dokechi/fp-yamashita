<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#19364d">
  <title>FP山下｜サイト準備中</title>
  <meta name="description" content="FP山下の公式サイトは現在準備中です。">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f5f3;
      --ink: #19364d;
      --text: #30363d;
      --muted: #6f777d;
      --accent: #d27643;
      --line: #d9dedf;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--text);
      background:
        radial-gradient(circle at 82% 18%, rgba(210, 118, 67, 0.12), transparent 24rem),
        linear-gradient(135deg, rgba(255, 255, 255, 0.66), transparent 48%),
        var(--paper);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    .page {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      top: 0;
      left: clamp(1.25rem, 6vw, 6rem);
      width: 1px;
      height: 100%;
      background: var(--line);
      pointer-events: none;
    }

    .header,
    .main,
    .footer {
      width: min(100% - 2.5rem, 72rem);
      margin-inline: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 5.5rem;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0.3rem rgba(210, 118, 67, 0.13);
    }

    .main {
      display: grid;
      align-items: center;
      padding-block: clamp(4rem, 11vw, 8rem);
    }

    .content {
      position: relative;
      max-width: 52rem;
    }

    .index {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0 0 1.75rem;
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
    }

    .index::after {
      content: "";
      width: 4rem;
      height: 1px;
      background: currentColor;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 500;
      line-height: 1.14;
      letter-spacing: -0.045em;
      word-break: auto-phrase;
      text-wrap: balance;
    }

    .lead {
      max-width: 35rem;
      margin: 2rem 0 0;
      padding-left: 1.2rem;
      border-left: 3px solid var(--accent);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.9;
      word-break: auto-phrase;
    }

    .note {
      margin: 1rem 0 0 1.4rem;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.8;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 42rem) {
      .header,
      .main,
      .footer {
        width: min(100% - 2rem, 72rem);
      }

      .page::before {
        left: 1rem;
      }

      .header {
        min-height: 4.75rem;
      }

      .status span {
        display: none;
      }

      .main {
        padding-block: 4.5rem;
      }

      h1 {
        font-size: clamp(2.8rem, 15vw, 4.6rem);
      }

      .lead {
        margin-top: 1.75rem;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 0.4rem;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .content {
        animation: reveal 0.7s ease-out both;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">FP山下</div>
      <div class="status" aria-label="サイト準備中"><span>Site in preparation</span></div>
    </header>

    <main class="main">
      <section class="content" aria-labelledby="page-title">
        <p class="index">COMING SOON</p>
        <h1 id="page-title">お金の話を、<br>売る前に。</h1>
        <p class="lead">FP山下の公式サイトは、現在公開に向けて準備を進めています。</p>
        <p class="note">FP相談と健康経営申請サポートについて、料金と内容を分かりやすくお伝えするサイトを制作中です。</p>
      </section>
    </main>

    <footer class="footer">
      <span>FP山下</span>
      <span>&copy; 2026 FP Yamashita</span>
    </footer>
  </div>
</body>
</html>
